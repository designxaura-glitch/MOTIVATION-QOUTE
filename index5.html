<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Motivation Space</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;
}

body {
    height: 100vh;
    overflow: hidden;
    background: black;
    display: flex;
    justify-content: center;
    align-items: center;
    color: white;
}

/* Stars */
.stars {
    position: absolute;
    width: 100%;
    height: 100%;
    background: transparent;
}

.stars::before, .stars::after {
    content: "";
    position: absolute;
    width: 2px;
    height: 2px;
    background: white;
    box-shadow:
        50px 100px white, 200px 300px white, 400px 150px white,
        600px 250px white, 800px 50px white, 1000px 200px white,
        1200px 400px white, 1400px 100px white, 1600px 300px white;
    animation: twinkle 2s infinite alternate;
}

.stars::after {
    box-shadow:
        100px 200px white, 300px 400px white, 500px 100px white,
        700px 300px white, 900px 150px white, 1100px 250px white,
        1300px 50px white, 1500px 350px white;
    animation-duration: 3s;
}

@keyframes twinkle {
    from { opacity: 0.3; }
    to { opacity: 1; }
}

/* Glass Card */
.container {
    position: relative;
    z-index: 1;
    text-align: center;
    padding: 40px;
    border-radius: 20px;
    background: rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(12px);
    box-shadow: 0 0 40px rgba(255,255,255,0.1);
    max-width: 600px;
}

.quote {
    font-size: 26px;
    line-height: 1.6;
    margin-bottom: 30px;
}

/* Button */
button {
    padding: 12px 28px;
    border: none;
    border-radius: 30px;
    font-size: 16px;
    cursor: pointer;
    color: white;
    background: linear-gradient(45deg, #00c6ff, #0072ff);
    transition: 0.3s;
    box-shadow: 0 0 15px rgba(0,198,255,0.6);
}

button:hover {
    transform: scale(1.08);
    box-shadow: 0 0 25px rgba(0,198,255,1);
}

button:active {
    transform: scale(0.95);
}
</style>
</head>

<body>

<div class="stars"></div>

<div class="container">
    <div id="quote" class="quote">
        Just push yourself for one more day — tomorrow you’ll be surprised by your own progress.
    </div>
    <button onclick="changeQuote()">New Motivation</button>
</div>

<script>
const quotes = [
    "Just push yourself for one more day — tomorrow you’ll be surprised by your own progress.",
    "Stay consistent — success is closer than you think.",
    "Small steps today lead to big wins tomorrow.",
    "Don’t stop — your future self is watching.",
    "Discipline today, freedom tomorrow."
];

function changeQuote() {
    const randomIndex = Math.floor(Math.random() * quotes.length);
    document.getElementById("quote").innerText = quotes[randomIndex];
}
</script>

</body>
</html>
